<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Bucketbook</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1c2620;
        --muted: #56665c;
        --paper: #ffffff;
        --green: #1f5b3f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eef5f0;
          --muted: #a3b5aa;
          --paper: #0f1712;
          --green: #7fd0a2;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 16px 0 4px;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #1f5b3f;
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Can't reach your server</h1>
      <p>
        Bucketbook lives on your own server, and this device can't reach it right now. Your books
        are safe there.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
