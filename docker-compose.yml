# Bucketbook: the app plus its Postgres database, grouped as "bucketbook" in Docker.
#
#   cp .env.example .env     # then fill in the required values
#   docker compose up -d
#
# (install.sh does both for you.) It runs the published image; to build from
# this source folder instead, see docker-compose.build.yml.
#
# Everything Bucketbook keeps is in this folder, so backing up the folder backs up
# Bucketbook:
#
#   data/postgres   the database's files (DATA_DIR in .env)
#   data/receipts   uploaded receipts
#   backups/        a nightly copy of the database (BACKUP_DIR, BACKUP_TIME, BACKUP_KEEP_DAYS)
#
# See docs/backup-restore.md.
name: bucketbook

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bucketbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bucketbook}
    # Modest settings that suit a household-sized database on a small server.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
    volumes:
      # Postgres makes the files inside belong to its own user (uid 70) on first start.
      - ${DATA_DIR:?DATA_DIR is missing from .env. Upgrading from 1.0.1 or earlier? Move your data first, see https://github.com/cbik6/bucketbook/blob/main/docs/backup-restore.md#upgrading-from-101-or-earlier}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # The published image; "1" follows every 1.x release.
    image: ${BUCKETBOOK_IMAGE:-ghcr.io/cbik6/bucketbook:1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bucketbook}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bucketbook}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      TZ: ${TZ:-UTC}
      BACKUP_STATUS_FILE: /backups/.last-backup.json
    ports:
      - "${APP_PORT:-9951}:9951"
    volumes:
      # The app makes this folder belong to its own user (uid 1001) when it starts.
      - ${DATA_DIR:?DATA_DIR is missing from .env. Upgrading from 1.0.1 or earlier? Move your data first, see https://github.com/cbik6/bucketbook/blob/main/docs/backup-restore.md#upgrading-from-101-or-earlier}/receipts:/data/receipts
      # Read-only, for the last backup's status in /api/health.
      - ${BACKUP_DIR:-./backups}:/backups:ro

  # Nightly pg_dump into ./backups. Same image as the app, so its pg_dump matches
  # Postgres. Back up now:  docker compose exec backup bucketbook-backup now
  backup:
    image: ${BUCKETBOOK_IMAGE:-ghcr.io/cbik6/bucketbook:1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bucketbook-backup"]
    command: ["schedule"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-bucketbook}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-bucketbook}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      disable: true
